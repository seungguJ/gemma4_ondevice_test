  <path d="M330 240 L295 352" class="line"/>
  <path d="M330 240 L295 420" class="line"/>
  <path d="M330 240 L520 420" class="line"/>
  <path d="M330 240 L748 420" class="line"/>
  <path d="M593 240 L946 568" class="line"/>
  <path d="M801 240 L946 568" class="line"/>
  <path d="M310 396 L553 358" class="line"/>
  <path d="M553 396 L781 358" class="line"/>
  <path d="M295 464 L295 568" class="line"/>
  <path d="M520 464 L295 568" class="line"/>
  <path d="M781 396 L295 568" class="line"/>
  <path d="M738 464 L530 568" class="line"/>
  <path d="M112 396 L112 568" class="line"/>
  <path d="M330 240 L736 568" class="line"/>
</svg>
