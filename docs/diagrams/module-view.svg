<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">Flow module view</title>
  <desc id="desc">Module view for UI, runtime, feature modules, and data stores.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .cluster { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; rx: 10; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.2; rx: 8; }
      .store { fill: #ecfeff; stroke: #0f766e; stroke-width: 1.2; rx: 8; }
      .runtime { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.2; rx: 8; }
      .feature { fill: #fffbeb; stroke: #b45309; stroke-width: 1.2; rx: 8; }
      .label { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .text { font: 13px Arial, sans-serif; fill: #0f172a; }
      .small { font: 12px Arial, sans-serif; fill: #475569; }
      .line { stroke: #334155; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="20" y="20" width="1140" height="100" class="cluster"/>
  <text x="42" y="48" class="label">UI Layer</text>
  <rect x="42" y="66" width="260" height="34" class="box"/>
  <text x="58" y="88" class="text">App Shell: MainActivity / GemmaComposeUi</text>
  <rect x="330" y="66" width="170" height="34" class="box"/>
  <text x="346" y="88" class="text">ScheduleScreen</text>
  <rect x="528" y="66" width="190" height="34" class="box"/>
  <text x="544" y="88" class="text">AppUsageScreen</text>

  <rect x="20" y="150" width="1140" height="125" class="cluster"/>
  <text x="42" y="178" class="label">Core Runtime</text>
  <rect x="42" y="202" width="150" height="38" class="runtime"/>
  <text x="58" y="226" class="text">Chat Session</text>
  <rect x="220" y="202" width="250" height="38" class="runtime"/>
  <text x="236" y="226" class="text">ModelRuntimeGate / LlmEngine</text>
  <rect x="498" y="202" width="190" height="38" class="runtime"/>
  <text x="514" y="226" class="text">Knowledge Routing</text>
  <rect x="716" y="202" width="170" height="38" class="runtime"/>
  <text x="732" y="226" class="text">Document Import</text>

  <rect x="20" y="305" width="1140" height="180" class="cluster"/>
  <text x="42" y="333" class="label">Feature Modules</text>
  <rect x="42" y="358" width="130" height="38" class="feature"/>
  <text x="58" y="382" class="text">Schedule</text>
  <rect x="200" y="358" width="220" height="38" class="feature"/>
  <text x="216" y="382" class="text">Wallet Notification Intake</text>
  <rect x="448" y="358" width="210" height="38" class="feature"/>
  <text x="464" y="382" class="text">Wallet Transaction Parser</text>
  <rect x="686" y="358" width="190" height="38" class="feature"/>
  <text x="702" y="382" class="text">Card Expense Ledger</text>
  <rect x="200" y="426" width="190" height="38" class="feature"/>
  <text x="216" y="450" class="text">Subscription Analysis</text>
  <rect x="420" y="426" width="200" height="38" class="feature"/>
  <text x="436" y="450" class="text">Card Expense Insight</text>
  <rect x="648" y="426" width="180" height="38" class="feature"/>
  <text x="664" y="450" class="text">App Usage Logging</text>

  <rect x="20" y="520" width="1140" height="160" class="cluster"/>
  <text x="42" y="548" class="label">Data / Assets</text>
  <rect x="42" y="574" width="135" height="38" class="store"/>
  <text x="58" y="598" class="text">App Preferences</text>
  <rect x="205" y="574" width="195" height="38" class="store"/>
  <text x="221" y="598" class="text">Wallet SharedPreferences</text>
  <rect x="428" y="574" width="205" height="38" class="store"/>
  <text x="444" y="598" class="text">App Usage SQLite DB</text>
  <rect x="661" y="574" width="150" height="38" class="store"/>
  <text x="677" y="598" class="text">Model Files</text>
  <rect x="839" y="574" width="215" height="38" class="store"/>
  <text x="855" y="598" class="text">Knowledge Assets / Storage</text>
  <text x="42" y="648" class="small">SQLite: app_usage_sessions, app_usage_meta</text>
  <text x="428" y="648" class="small">Wallet stores: notification_inbox_store, wallet_card_transactions, card_expense_insight_store</text>

  <path d="M172 100 L172 196" class="line"/>
  <path d="M302 100 L330 196" class="line"/>
  <path d="M415 100 L415 352" class="line"/>
  <path d="M623 100 L738 420" class="line"/>
